name: ptp-logger
services:
  ptp-logger:
    build: .
    ports:
      - "3340:3340"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.config/rclone:/home/node/.config/rclone:ro
    group_add: ["${DOCKER_GID:-115}"]
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
