name: ptp-logger
services:
  ptp-logger:
    build: .
    ports:
      - "3340:3340"
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ${HOME}/.config/rclone:/home/node/.config/rclone:ro
      - /run/log/journal:/run/log/journal:ro
      - /var/log/journal:/var/log/journal:ro
      - /etc/machine-id:/etc/machine-id:ro
      - /sys/class/power_supply:/sys/class/power_supply:ro
    group_add: ["${DOCKER_GID:-115}", "${JOURNAL_GID:-999}"]
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
