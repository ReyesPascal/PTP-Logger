name: ptp-logger
services:
  ptp-logger:
    build: .
    network_mode: host
    volumes:
      - ./data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add: ["${DOCKER_GID:-115}"]
    cpus: 0.5
    mem_limit: 256m
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
